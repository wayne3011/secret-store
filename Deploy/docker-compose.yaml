networks:
  secret-store-dev:
    driver: bridge
services:
  storage-service:
    build:
      context: https://github.com/wayne3011/secret-store.git#master:source/SecretStore
      dockerfile: Dockerfile
    networks:
      - secret-store-dev
    restart: no
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - ./appsettings.json:/app/build/appsettings.json
    depends_on:
      pgsql-secret-storage:
        condition: service_healthy

  pgsql-secret-storage:
    image: postgres:latest
    container_name: pgsql-secret-storage
    restart: always
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: StoreSecret
    volumes:
      - secret_storage_pgdata:/var/lib/postgresql/data
    networks:
      - secret-store-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d StoreSecret"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  secret_storage_pgdata:
